spring.application.name=form
server.port=8099
spring.datasource.url=jdbc:postgresql://localhost:5432/form
spring.datasource.username=username
spring.datasource.password=password
spring.jpa.show-sql=false
form.allowed-sort=createdAt,updatedAt,title,status,startDate,endDate
form.allowed-facets=status,contextType,orgId,createdBy

spring.datasource.hikari.maximum-pool-size=60
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=5000

spring.jpa.properties.hibernate.format_sql=false
logging.level.com.karmayogi.form=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type=OFF

# Exact match filters
form.filter-field-map.status=status
form.filter-field-map.contextType=contextType
form.filter-field-map.createdBy=createdBy
form.filter-field-map.orgId=orgId
form.filter-field-map.formId=formId
form.filter-field-map.batchId=batchId
form.filter-field-map.courseId=courseId

# Date FROM filters
form.date-from-map.startDateFrom=createdAt
form.date-from-map.endDateFrom=endDate

# Date TO filters
form.date-to-map.startDateTo=createdAt
form.date-to-map.endDateTo=endDate

spring.data.redis.host=localhost
spring.data.redis.port=6379
form.cache.ttl.hours=1
# Form validation config
form.max-fields=30
form.allowed-context-types=form,assignment,peerValidationSurvey,completionSurvey,AGKPublicSurvey,program-completion-form
form.allowed-field-types=text,textarea,dropdown,checkbox,radio,boolean,date,email,numeric,phone number,rating,numericRating,heading,separator

# ── Input validation patterns and limits (InputValidator) ──────────
form.validation.url-pattern=(?i)(https?://|www\\.)\\S+
form.validation.html-pattern=<[^>]*>
form.validation.script-pattern=(?i)(script|javascript|onerror|onload|onclick|eval\\(|alert\\()
form.validation.max-title-length=255
form.validation.max-field-name-length=500
form.peer-survey-content-read-fields=status,courseCategory,appIcon,lastPublishedOn
form.content.base.url=http://localhost:9008
form.peer-survey-allowed-additional-properties=identifier,triggerAfter,completionLookBack,thumbnail,duration,publishedOn
form.peer-survey-allowed-content-types=Course,Moderated Course,Multilingual Course,Curated Program,Moderated Program,Invite Only Program,Blended Program,Comprehensive Assessment Program
form.peer-survey-min-trigger-after=30
form.peer-survey-max-trigger-after=60
form.peer-survey-trigger-after-step=5
form.peer-survey-min-lookback=1
form.peer-survey-max-lookback=180
form.peer-survey-max-fields=2
form.allowed-url-regex=^(https?:\\/\\/)[a-zA-Z0-9\\-._~:/?#\\[\\]@!$&'()*+,;=%]{1,500}$
form.sb-url=http://localhost:9016
form.user-search-end-point=/private/user/v1/search
form.kafka.topic.form-events=localtesting
form.kafka.bootstrap-servers=localhost:9092
form.allowed-field-property-keys=refApi,logicalGroupCode,name,notApplicable,fieldType,values,width,isRequired,order,parentId
form.allowed-form-property-keys=title,meta,fields,clientVersion,contextType,additionalProperties
form.v2-client-version=1.2
form.v1-client-version=1.1
form.non-question-field-types=heading,separator

form.elasticsearch.host=localhost
form.elasticsearch.port=9200
form.elasticsearch.scheme=http
form.elasticsearch.index=fs-forms-alias-v2

form.kafka.consumer.group-id=form-es-sync-group
form.kafka.consumer.concurrency=3
form.kafka.consumer.auto-offset-reset=earliest
form.kafka.consumer.max-poll-records=10
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
form.elasticsearch.connect-timeout-ms=5000
form.elasticsearch.socket-timeout-ms=10000

form.search-max-page=1000
form.search-max-page-size=200
form.search-default-page-size=10
form.es-timeout-seconds=30
form.search-index=fs-forms-v3
form.search-supported-context-types=form,completionSurvey,peerValidationSurvey,assignment
form.search-allowed-filter-keys=formId,status,contextType,createdBy,orgId,startDateFrom,startDateTo,endDateFrom,endDateTo
form.submission-allowed-filter-keys=formId,status,createdBy,createdDate,submittedBy,submittedDate,contextId,updatedBy,updatedDate,additionalProperties.batchId,contextType,contextOrgId
form.form-context-hide-creator-fields=AGKPublicSurvey,completionSurvey
form.max-allowed-filter-list-size=50
form.validation-url-allowed-keys=assignmentUrl,thumbnailUrl,submitUrl
form.validation-url-allowed-domains=portal.dev.karmayogibharat.net,igot.gov.in